name: Tests

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.1"
            laravel: "10"
            testbench: "^8.0"
          - php: "8.2"
            laravel: "10"
            testbench: "^8.0"
          - php: "8.2"
            laravel: "11"
            testbench: "^9.0"
          - php: "8.3"
            laravel: "11"
            testbench: "^9.0"
          - php: "8.2"
            laravel: "12"
            testbench: "^10.0"
          - php: "8.3"
            laravel: "12"
            testbench: "^10.0"
          - php: "8.4"
            laravel: "12"
            testbench: "^10.0"
          - php: "8.3"
            laravel: "13"
            testbench: "^11.0"
          - php: "8.4"
            laravel: "13"
            testbench: "^11.0"

    name: PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv
          coverage: none

      - name: Install dependencies
        run: |
          composer require \
            "illuminate/support:^${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            --no-update
          composer update --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit
